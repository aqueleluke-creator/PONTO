<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Ponto Eletrônico</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
    }

    .header-clock {
      text-align: center;
    }

    .clock {
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--primary);
      margin: 10px 0;
      font-variant-numeric: tabular-nums;
    }

    .date {
      font-size: 1rem;
      color: #64748b;
      text-transform: capitalize;
    }

    .daily-summary {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 16px;
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-title {
      font-size: 0.9rem;
      color: #1e40af;
      font-weight: 600;
    }

    .summary-hours {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1e3a8a;
      font-variant-numeric: tabular-nums;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      color: white;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-entrada { background-color: var(--success); }
    .btn-pausa { background-color: var(--warning); }
    .btn-retorno { background-color: #0284c7; }
    .btn-saida { background-color: var(--danger); }
    
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-secondary {
      background-color: #64748b;
      font-size: 0.85rem;
      padding: 8px 12px;
    }

    .btn-clear {
      background-color: #ef4444;
      font-size: 0.85rem;
      padding: 8px 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f1f5f9;
      color: #475569;
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      color: white;
    }

    .badge-entrada { background-color: var(--success); }
    .badge-pausa { background-color: var(--warning); }
    .badge-retorno { background-color: #0284c7; }
    .badge-saida { background-color: var(--danger); }

    .empty-msg {
      text-align: center;
      color: #94a3b8;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Relógio em Tempo Real -->
    <div class="card header-clock">
      <h2>Ponto Eletrônico</h2>
      <div class="clock" id="clock">00:00:00</div>
      <div class="date" id="date">--</div>

      <!-- Resumo de Horas Trabalhadas no Dia -->
      <div class="daily-summary">
        <div class="summary-title">Total Trabalhado Hoje:</div>
        <div class="summary-hours" id="totalToday">00h 00m</div>
      </div>
    </div>

    <!-- Área de Registro -->
    <div class="card">
      <div class="input-group">
        <label for="employeeName">Nome do Colaborador</label>
        <input type="text" id="employeeName" placeholder="Digite seu nome ou ID">
      </div>

      <div class="buttons-grid">
        <button class="btn-entrada" onclick="registerPoint('Entrada')">Entrada</button>
        <button class="btn-pausa" onclick="registerPoint('Início Pausa')">Pausa</button>
        <button class="btn-retorno" onclick="registerPoint('Retorno Pausa')">Retorno</button>
        <button class="btn-saida" onclick="registerPoint('Saída')">Saída</button>
      </div>
    </div>

    <!-- Tabela de Histórico -->
    <div class="card">
      <div class="actions-bar">
        <h3>Histórico de Registros</h3>
        <div>
          <button class="btn-secondary" onclick="exportToCSV()">Exportar CSV</button>
          <button class="btn-clear" onclick="clearHistory()">Limpar</button>
        </div>
      </div>

      <table id="recordsTable">
        <thead>
          <tr>
            <th>Data</th>
            <th>Hora</th>
            <th>Nome</th>
            <th>Tipo</th>
          </tr>
        </thead>
        <tbody id="recordsBody">
          <!-- Registros renderizados via JavaScript -->
        </tbody>
      </table>
      <div id="emptyMessage" class="empty-msg">Nenhum ponto registrado até o momento.</div>
    </div>
  </div>

  <script>
    // Atualização do Relógio
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('pt-BR');
      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const dateStr = now.toLocaleDateString('pt-BR', dateOptions);

      document.getElementById('clock').textContent = timeStr;
      document.getElementById('date').textContent = dateStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Carregar registros salvos
    function getStoredRecords() {
      const data = localStorage.getItem('ponto_registros');
      return data ? JSON.parse(data) : [];
    }

    // Registrar ponto
    function registerPoint(type) {
      const nameInput = document.getElementById('employeeName');
      const name = nameInput.value.trim() || 'Não Identificado';
      
      const now = new Date();
      const record = {
        id: Date.now(),
        timestamp: now.getTime(), // Salva o tempo em milissegundos para facilitar cálculos
        date: now.toLocaleDateString('pt-BR'),
        time: now.toLocaleTimeString('pt-BR'),
        name: name,
        type: type
      };

      const records = getStoredRecords();
      records.unshift(record); // Adiciona no início da lista
      localStorage.setItem('ponto_registros', JSON.stringify(records));

      renderRecords();
    }

    // Cálculo das Horas Trabalhadas
    function calculateDailyHours(dateString) {
      const records = getStoredRecords().filter(r => r.date === dateString);
      
      // Ordena os registros do mais antigo para o mais recente para calcular na ordem certa
      const sorted = records.sort((a, b) => a.timestamp - b.timestamp);

      let totalMs = 0;
      let lastEntrada = null;
      let lastRetorno = null;

      sorted.forEach(rec => {
        if (rec.type === 'Entrada') {
          lastEntrada = rec.timestamp;
        } else if (rec.type === 'Início Pausa' && lastEntrada) {
          totalMs += (rec.timestamp - lastEntrada);
          lastEntrada = null; // Reseta após fechar o período
        } else if (rec.type === 'Retorno Pausa') {
          lastRetorno = rec.timestamp;
        } else if (rec.type === 'Saída') {
          if (lastRetorno) {
            totalMs += (rec.timestamp - lastRetorno);
            lastRetorno = null;
          } else if (lastEntrada) {
            totalMs += (rec.timestamp - lastEntrada);
            lastEntrada = null;
          }
        }
      });

      // Se a pessoa deu entrada ou retorno mas ainda não registrou a saída/pausa, conta até o horário atual
      const now = Date.now();
      if (lastEntrada) {
        totalMs += (now - lastEntrada);
      } else if (lastRetorno) {
        totalMs += (now - lastRetorno);
      }

      const totalMinutes = Math.floor(totalMs / (1000 * 60));
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;

      return `${String(hours).padStart(2, '0')}h ${String(minutes).padStart(2, '0')}m`;
    }

    // Renderizar tabela e atualizar o total diário
    function renderRecords() {
      const records = getStoredRecords();
      const tbody = document.getElementById('recordsBody');
      const emptyMsg = document.getElementById('emptyMessage');
      const todayStr = new Date().toLocaleDateString('pt-BR');

      // Atualiza o contador de horas de hoje
      document.getElementById('totalToday').textContent = calculateDailyHours(todayStr);

      tbody.innerHTML = '';

      if (records.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }

      emptyMsg.style.display = 'none';

      records.forEach(rec => {
        const tr = document.createElement('tr');
        
        let badgeClass = 'badge-entrada';
        if (rec.type === 'Início Pausa') badgeClass = 'badge-pausa';
        if (rec.type === 'Retorno Pausa') badgeClass = 'badge-retorno';
        if (rec.type === 'Saída') badgeClass = 'badge-saida';

        tr.innerHTML = `
          <td>${rec.date}</td>
          <td>${rec.time}</td>
          <td>${rec.name}</td>
          <td><span class="badge ${badgeClass}">${rec.type}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Recalcula o tempo a cada minuto para manter o relógio diário atualizado em tempo real
    setInterval(() => {
      const todayStr = new Date().toLocaleDateString('pt-BR');
      document.getElementById('totalToday').textContent = calculateDailyHours(todayStr);
    }, 60000);

    // Exportar para arquivo CSV (inclui timestamp)
    function exportToCSV() {
      const records = getStoredRecords();
      if (records.length === 0) {
        alert('Não há registros para exportar.');
        return;
      }

      let csvContent = 'data:text/csv;charset=utf-8,Data;Hora;Nome;Tipo\n';
      records.forEach(r => {
        csvContent += `${r.date};${r.time};${r.name};${r.type}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `ponto_eletronico_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Limpar histórico
    function clearHistory() {
      if (confirm('Tem certeza que deseja apagar todo o histórico de pontos?')) {
        localStorage.removeItem('ponto_registros');
        renderRecords();
      }
    }

    // Inicialização
    renderRecords();
  </script>
</body>
</html>
