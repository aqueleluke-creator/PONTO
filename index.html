<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Ponto Eletrônico</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .header-clock {
      text-align: center;
    }

    .clock {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary);
      margin: 6px 0;
      font-variant-numeric: tabular-nums;
    }

    .date {
      font-size: 0.95rem;
      color: #64748b;
      text-transform: capitalize;
    }

    .daily-summary {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-title {
      font-size: 0.9rem;
      color: #1e40af;
      font-weight: 600;
    }

    .summary-hours {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1e3a8a;
      font-variant-numeric: tabular-nums;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    /* Grid de Botões Adaptável */
    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      color: white;
      transition: opacity 0.2s, transform 0.1s;
      width: 100%;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-entrada { background-color: var(--success); }
    .btn-pausa { background-color: var(--warning); }
    .btn-retorno { background-color: #0284c7; }
    .btn-saida { background-color: var(--danger); }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .actions-btns {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      background-color: #64748b;
      font-size: 0.85rem;
      padding: 8px 12px;
      width: auto;
    }

    .btn-clear {
      background-color: #ef4444;
      font-size: 0.85rem;
      padding: 8px 12px;
      width: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f1f5f9;
      color: #475569;
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: white;
      text-align: center;
    }

    .badge-entrada { background-color: var(--success); }
    .badge-pausa { background-color: var(--warning); }
    .badge-retorno { background-color: #0284c7; }
    .badge-saida { background-color: var(--danger); }

    .empty-msg {
      text-align: center;
      color: #94a3b8;
      padding: 20px 0;
    }

    /* ESTILOS ESPECÍFICOS PARA MOBILE */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .clock {
        font-size: 2.2rem;
      }

      .buttons-grid {
        grid-template-columns: 1fr; /* Um botão por linha no celular para facilitar o toque */
      }

      /* Transforma a tabela em lista de cards no Mobile */
      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead {
        display: none; /* Esconde o cabeçalho no mobile */
      }

      tr {
        margin-bottom: 12px;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
      }

      td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px dashed var(--border);
      }

      td:last-child {
        border-bottom: none;
      }

      td::before {
        content: attr(data-label);
        font-weight: 600;
        color: #64748b;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Relógio em Tempo Real -->
    <div class="card header-clock">
      <h2>Ponto Eletrônico</h2>
      <div class="clock" id="clock">00:00:00</div>
      <div class="date" id="date">--</div>

      <!-- Resumo de Horas Trabalhadas -->
      <div class="daily-summary">
        <div class="summary-title">Trabalhado Hoje:</div>
        <div class="summary-hours" id="totalToday">00h 00m</div>
      </div>
    </div>

    <!-- Área de Registro -->
    <div class="card">
      <div class="input-group">
        <label for="employeeName">Nome ou Matrícula</label>
        <input type="text" id="employeeName" placeholder="Ex: Maria Silva - 1024">
      </div>

      <div class="buttons-grid">
        <button class="btn-entrada" id="btn-Entrada" onclick="registerPoint('Entrada')">Entrada</button>
        <button class="btn-pausa" id="btn-Início Pausa" onclick="registerPoint('Início Pausa')">Pausa</button>
        <button class="btn-retorno" id="btn-Retorno Pausa" onclick="registerPoint('Retorno Pausa')">Retorno</button>
        <button class="btn-saida" id="btn-Saída" onclick="registerPoint('Saída')">Saída</button>
      </div>
    </div>

    <!-- Tabela / Cards de Histórico -->
    <div class="card">
      <div class="actions-bar">
        <h3>Registros</h3>
        <div class="actions-btns">
          <button class="btn-secondary" onclick="exportToCSV()">Exportar</button>
          <button class="btn-clear" onclick="clearHistory()">Limpar</button>
        </div>
      </div>

      <table id="recordsTable">
        <thead>
          <tr>
            <th>Data</th>
            <th>Hora</th>
            <th>Nome</th>
            <th>Tipo</th>
          </tr>
        </thead>
        <tbody id="recordsBody">
          <!-- Registros carregados via JS -->
        </tbody>
      </table>
      <div id="emptyMessage" class="empty-msg">Nenhum ponto registrado.</div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('pt-BR');
      
      const dateOptions = { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('pt-BR', dateOptions);
    }
    setInterval(updateClock, 1000);
    updateClock();

    function getStoredRecords() {
      const data = localStorage.getItem('ponto_registros');
      return data ? JSON.parse(data) : [];
    }

    function registerPoint(type) {
      const nameInput = document.getElementById('employeeName');
      const name = nameInput.value.trim() || 'Colaborador Sem Nome';
      
      const now = new Date();
      const record = {
        id: Date.now(),
        timestamp: now.getTime(),
        date: now.toLocaleDateString('pt-BR'),
        time: now.toLocaleTimeString('pt-BR'),
        name: name,
        type: type
      };

      const records = getStoredRecords();
      records.unshift(record);
      localStorage.setItem('ponto_registros', JSON.stringify(records));

      renderRecords();
    }

    function calculateDailyHours(dateString) {
      const records = getStoredRecords().filter(r => r.date === dateString);
      const sorted = records.sort((a, b) => a.timestamp - b.timestamp);

      let totalMs = 0;
      let lastEntrada = null;
      let lastRetorno = null;

      sorted.forEach(rec => {
        if (rec.type === 'Entrada') lastEntrada = rec.timestamp;
        else if (rec.type === 'Início Pausa' && lastEntrada) {
          totalMs += (rec.timestamp - lastEntrada);
          lastEntrada = null;
        } else if (rec.type === 'Retorno Pausa') lastRetorno = rec.timestamp;
        else if (rec.type === 'Saída') {
          if (lastRetorno) {
            totalMs += (rec.timestamp - lastRetorno);
            lastRetorno = null;
          } else if (lastEntrada) {
            totalMs += (rec.timestamp - lastEntrada);
            lastEntrada = null;
          }
        }
      });

      const now = Date.now();
      if (lastEntrada) totalMs += (now - lastEntrada);
      if (lastRetorno) totalMs += (now - lastRetorno);

      const totalMinutes = Math.floor(totalMs / (1000 * 60));
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;

      return `${String(hours).padStart(2, '0')}h ${String(minutes).padStart(2, '0')}m`;
    }

    function renderRecords() {
      const records = getStoredRecords();
      const tbody = document.getElementById('recordsBody');
      const emptyMsg = document.getElementById('emptyMessage');
      const todayStr = new Date().toLocaleDateString('pt-BR');

      document.getElementById('totalToday').textContent = calculateDailyHours(todayStr);

      tbody.innerHTML = '';

      if (records.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }

      emptyMsg.style.display = 'none';

      records.forEach(rec => {
        const tr = document.createElement('tr');
        
        let badgeClass = 'badge-entrada';
        if (rec.type === 'Início Pausa') badgeClass = 'badge-pausa';
        if (rec.type === 'Retorno Pausa') badgeClass = 'badge-retorno';
        if (rec.type === 'Saída') badgeClass = 'badge-saida';

        tr.innerHTML = `
          <td data-label="Data">${rec.date}</td>
          <td data-label="Hora">${rec.time}</td>
          <td data-label="Nome">${rec.name}</td>
          <td data-label="Tipo"><span class="badge ${badgeClass}">${rec.type}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    setInterval(() => {
      const todayStr = new Date().toLocaleDateString('pt-BR');
      document.getElementById('totalToday').textContent = calculateDailyHours(todayStr);
    }, 30000);

    function exportToCSV() {
      const records = getStoredRecords();
      if (records.length === 0) {
        alert('Não há registros para exportar.');
        return;
      }

      let csvContent = '\uFEFFData;Hora;Nome;Tipo\n'; // \uFEFF força codificação UTF-8 no Excel
      records.forEach(r => {
        csvContent += `${r.date};${r.time};${r.name};${r.type}\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `ponto_eletronico_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function clearHistory() {
      if (confirm('Tem certeza que deseja apagar todo o histórico de pontos?')) {
        localStorage.removeItem('ponto_registros');
        renderRecords();
      }
    }

    renderRecords();
  </script>
</body>
</html>
    // Inicialização
    renderRecords();
  </script>
</body>
</html>
